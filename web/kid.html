<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#94b8c7">
<title>MoMo 的伙伴</title>
<link rel="stylesheet" href="/kid.css">
<script type="module" src="/kid.js"></script>
</head>
<body data-girl="b">

<div id="locked" class="cover" hidden>
  <div class="cover-card glass">
    <h1>这个链接打不开了</h1>
    <p>可能是妈妈换了新链接。请妈妈在家长后台的「平板」页复制最新的链接，再打开一次。</p>
  </div>
</div>

<div id="start" class="cover" hidden>
  <button id="startBtn" class="start-btn" type="button">
    <img id="startImg" alt="">
    <span>点一下，叫醒伙伴</span>
  </button>
</div>

<main id="app" hidden>
  <div id="scene" class="scene" aria-hidden="true"><img alt=""><img alt=""></div>
  <div class="stage" id="stage">
    <div class="ground" aria-hidden="true"></div>
    <figure class="girl" id="girlFig">
      <div class="frame">
        <img class="base" id="girlImg" alt="">
        <canvas class="live" aria-hidden="true"></canvas>
        <img class="pose" alt="" aria-hidden="true">
      </div>
      <div class="hit"></div>
    </figure>
    <figure class="pet" id="petFig">
      <div class="shadow" aria-hidden="true"></div>
      <div class="body"><div class="sprite"><img id="petImg" alt=""></div><canvas class="walk" aria-hidden="true"></canvas></div>
      <figcaption id="petSay" class="glass" hidden></figcaption>
    </figure>
  </div>
  <div class="night" aria-hidden="true"></div>

  <header class="bar">
    <div class="when"><b id="date" class="glass"></b><span id="dlabel" class="tag"></span></div>
    <div id="next" class="next glass"></div>
    <div id="alarm" class="tag alarm glass" hidden></div>
    <div id="looked" class="tag alarm glass" hidden></div>
  </header>

  <section id="bubble" class="bubble" aria-live="polite" hidden>
    <div class="frost"></div>
    <svg class="shape" aria-hidden="true"><path></path></svg>
    <p id="say"></p>
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </section>

  <aside class="side">
    <div class="panel glass">
      <h2>今天要做的事</h2>
      <ul id="tasks" class="tasks"></ul>
    </div>
    <div class="panel glass love">
      <div class="love-row"><b id="petName"></b><span id="stageName" class="tag"></span><button id="swap" class="ghost small" type="button">换伙伴</button></div>
      <div class="meter"><i id="meterFill"></i></div>
      <span id="loveText" class="love-text"></span>
    </div>
  </aside>

  <div class="dock">
    <p id="heard" class="heard glass" hidden></p>
    <form id="typeForm" class="type glass" hidden>
      <input id="typeText" maxlength="100" placeholder="打字也可以" autocomplete="off">
      <button type="submit">发送</button>
    </form>
    <div class="talk">
      <button id="mic" class="mic" type="button">按一下说话</button>
      <button id="photoBtn" class="ghost glass round" type="button" aria-label="拍照或发文件给伙伴看">📷</button>
      <button id="kbd" class="ghost glass round" type="button">打字</button>
      <input id="photoInput" type="file" hidden>
    </div>
  </div>
</main>

<!-- Shown whenever the camera is on (a check-in Mom asked for), with what it sees. -->
<div id="camBox" class="cam glass" hidden aria-live="polite">
  <video id="camView" playsinline muted></video>
  <span>📷 在拍照</span>
</div>

<div id="picker" class="sheet" hidden>
  <div class="sheet-card wide" role="dialog" aria-label="换伙伴">
    <h2>选一个说话的伙伴</h2>
    <div id="pickGirls" class="pick"></div>
    <h2>选一个一起长大的宠物</h2>
    <div id="pickPets" class="pick"></div>
    <h2>没有事的时候，在哪儿玩</h2>
    <div id="pickScenes" class="pick places"></div>
    <button id="pickClose" class="ghost" type="button">好啦</button>
  </div>
</div>

<div id="confirm" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-label="确认">
    <p id="confirmText"></p>
    <div class="row">
      <button id="confirmStart" type="button" hidden>现在开始</button>
      <button id="confirmYes" type="button">做完啦</button>
      <button id="confirmNo" class="ghost" type="button">算了</button>
    </div>
  </div>
</div>

</body>
</html>
