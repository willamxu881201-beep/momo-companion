<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#94b8c7">
<title>MoMo 的伙伴</title>
<link rel="stylesheet" href="/kid.css">
<script type="module" src="/kid.js"></script>
</head>
<body data-girl="b">

<div id="locked" class="cover" hidden>
  <div class="cover-card glass">
    <h1>这个链接打不开了</h1>
    <p>可能是妈妈换了新链接。请妈妈在家长后台的「平板」页复制最新的链接，再打开一次。</p>
  </div>
</div>

<div id="start" class="cover" hidden>
  <button id="startBtn" class="start-btn" type="button">
    <img id="startImg" alt="">
    <span>点一下，叫醒伙伴</span>
  </button>
</div>

<main id="app" hidden>
  <div id="scene" class="scene" aria-hidden="true"><img alt=""><img alt=""></div>
  <div class="stage" id="stage">
    <div class="ground" aria-hidden="true"></div>
    <figure class="girl" id="girlFig">
      <div class="frame">
        <img class="base" id="girlImg" alt="">
        <canvas class="live" aria-hidden="true"></canvas>
        <img class="pose" alt="" aria-hidden="true">
      </div>
      <div class="hit"></div>
    </figure>
    <figure class="pet" id="petFig">
      <div class="shadow" aria-hidden="true"></div>
      <div class="body"><div class="sprite"><img id="petImg" alt=""></div><canvas class="walk" aria-hidden="true"></canvas></div>
      <figcaption id="petSay" class="glass" hidden></figcaption>
    </figure>
  </div>
  <div class="night" aria-hidden="true"></div>

  <header class="bar">
    <div class="when"><b id="date" class="glass"></b><span id="dlabel" class="tag"></span></div>
    <div id="next" class="next glass"></div>
    <div id="alarm" class="tag alarm glass" hidden></div>
    <div id="looked" class="tag alarm glass" hidden></div>
    <div id="wakeTag" class="tag alarm glass" hidden></div>
  </header>

  <section id="bubble" class="bubble" aria-live="polite" hidden>
    <div class="frost"></div>
    <svg class="shape" aria-hidden="true"><path></path></svg>
    <p id="say"></p>
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </section>

  <!-- The rail: what she can open beside the companion. Each opens its panel on the
       right (on a phone, over the lower part); the right side is empty otherwise. -->
  <nav class="rail" aria-label="功能">
    <button class="ghost glass round" type="button" data-panel="tasks" aria-label="今天要做的事" title="今天要做的事"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.5h10.5M9.5 12h10.5M9.5 17.5h10.5"/><path d="M3.5 6.6l1.4 1.4 2.4-2.8M3.5 12.1l1.4 1.4 2.4-2.8M3.5 17.6l1.4 1.4 2.4-2.8"/></svg></button>
    <button class="ghost glass round" type="button" data-panel="files" aria-label="图书馆" title="图书馆"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.6C10.2 5.1 7.6 4.6 4 4.9v13.4c3.6-.3 6.2.2 8 1.7 1.8-1.5 4.4-2 8-1.7V4.9c-3.6-.3-6.2.2-8 1.7z"/><path d="M12 6.6v13.4"/></svg><b id="filesNew" class="badge" hidden></b></button>
    <button class="ghost glass round" type="button" data-panel="love" aria-label="好感度" title="好感度"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19.6s-7-4.3-8.6-8.5C2.2 7.9 4.2 4.8 7.4 4.8c1.9 0 3.4 1 4.6 2.6 1.2-1.6 2.7-2.6 4.6-2.6 3.2 0 5.2 3.1 4 6.3-1.6 4.2-8.6 8.5-8.6 8.5z"/></svg></button>
  </nav>

  <aside class="side" id="side">
    <section id="panel-tasks" class="panel glass" hidden>
      <div class="panel-top"><h2>今天要做的事</h2><button class="x" type="button" data-close aria-label="关上"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
      <ul id="tasks" class="tasks"></ul>
    </section>

    <!-- 图书馆: her files and what Mom sent for her; one opens here to look at, and to
         point at: a touch on the page asks the companion what is there. -->
    <section id="panel-files" class="panel glass files" hidden>
      <div id="fileList">
        <div class="panel-top"><h2>图书馆</h2><button class="x" type="button" data-close aria-label="关上"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
        <p id="filesNone" class="files-none" hidden>还没有文件。妈妈发给你的、你发给伙伴的，都会放在这里。</p>
        <ul id="fileItems" class="file-items"></ul>
        <button id="filesMore" class="ghost" type="button" hidden>再看更早的</button>
      </div>
      <div id="fileView" class="viewer" hidden>
        <div class="panel-top">
          <button id="fileBack" class="x" type="button" aria-label="回到图书馆"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
          <h2 id="fileTitle"></h2>
          <button id="paperZoom" class="x" type="button" aria-label="放大" aria-pressed="false" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M10.5 7.8v5.4M7.8 10.5h5.4"/></svg></button>
          <button class="x" type="button" data-close aria-label="关上"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
        </div>
        <p id="fileMeta" class="file-meta"></p>
        <div id="paperBox" class="paper-box" hidden>
          <div id="paper" class="paper"><img id="paperImg" alt=""><div id="marks" class="marks"></div></div>
        </div>
        <div id="pager" class="pager" hidden>
          <button id="pagePrev" class="ghost" type="button">上一页</button>
          <span id="pageNo"></span>
          <button id="pageNext" class="ghost" type="button">下一页</button>
        </div>
        <p id="pointHint" class="point-hint" hidden></p>
        <div id="fileShow" class="file-show"></div>
        <p id="fileGist" class="file-gist"></p>
        <div id="fileMore" class="file-more"></div>
        <details id="fileWords" class="file-words" hidden>
          <summary>看原文</summary>
          <div id="fileText" class="file-text"></div>
          <button id="fileTextMore" class="ghost" type="button" hidden>接着看</button>
        </details>
        <div class="row">
          <button id="fileAsk" type="button" hidden>讲给我听</button>
          <a id="fileOpen" class="ghost" href="#" target="_blank" rel="noopener" hidden>打开原文件</a>
        </div>
      </div>
    </section>

    <section id="panel-love" class="panel glass love" hidden>
      <div class="panel-top"><h2>好感度</h2><button class="x" type="button" data-close aria-label="关上"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
      <img id="lovePet" class="love-pet" alt="">
      <div class="love-row"><b id="petName"></b><span id="stageName" class="tag"></span></div>
      <div class="meter"><i id="meterFill"></i></div>
      <p id="loveText" class="love-text"></p>
      <button id="swap" class="ghost" type="button">换伙伴</button>
    </section>
  </aside>

  <div class="dock">
    <p id="heard" class="heard glass" hidden></p>
    <form id="typeForm" class="type glass" hidden>
      <input id="typeText" maxlength="100" placeholder="打字也可以" autocomplete="off">
      <button type="submit">发送</button>
    </form>
    <div class="talk">
      <button id="mic" class="mic" type="button">按一下说话</button>
      <button id="photoBtn" class="ghost glass round" type="button" aria-label="发照片或文件给伙伴看" title="发照片或文件"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4.5M7 9.5l5-5 5 5M4.5 14.5v3a2.5 2.5 0 0 0 2.5 2.5h10a2.5 2.5 0 0 0 2.5-2.5v-3"/></svg></button>
      <button id="kbd" class="ghost glass round" type="button" aria-label="打字" title="打字"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12.5" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M6.5 14.5h.01M17.5 14.5h.01M9.5 14.5h5"/></svg></button>
      <input id="photoInput" type="file" hidden>
    </div>
  </div>
</main>

<!-- Shown whenever the camera is on (a check-in Mom asked for), with what it sees. -->
<div id="camBox" class="cam glass" hidden aria-live="polite">
  <video id="camView" playsinline muted></video>
  <span>📷 在拍照</span>
</div>

<div id="picker" class="sheet" hidden>
  <div class="sheet-card wide" role="dialog" aria-label="换伙伴">
    <h2>选一个说话的伙伴</h2>
    <div id="pickGirls" class="pick"></div>
    <h2>选一个一起长大的宠物</h2>
    <div id="pickPets" class="pick"></div>
    <h2>没有事的时候，在哪儿玩</h2>
    <div id="pickScenes" class="pick places"></div>
    <button id="pickClose" class="ghost" type="button">好啦</button>
  </div>
</div>

<div id="confirm" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-label="确认">
    <p id="confirmText"></p>
    <div class="row">
      <button id="confirmStart" type="button" hidden>现在开始</button>
      <button id="confirmYes" type="button">做完啦</button>
      <button id="confirmNo" class="ghost" type="button">算了</button>
    </div>
  </div>
</div>

</body>
</html>
