<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#94b8c7">
<title>MoMo 的伙伴</title>
<link rel="stylesheet" href="/kid.css">
<script src="/kid.js" defer></script>
</head>
<body data-girl="b">

<div id="locked" class="cover" hidden>
  <div class="cover-card glass">
    <h1>这个链接打不开了</h1>
    <p>可能是妈妈换了新链接。请妈妈在家长后台的「平板」页复制最新的链接，再打开一次。</p>
  </div>
</div>

<div id="start" class="cover" hidden>
  <button id="startBtn" class="start-btn" type="button">
    <img id="startImg" alt="">
    <span>点一下，叫醒伙伴</span>
  </button>
</div>

<main id="app" hidden>
  <figure class="girl" id="girlFig">
    <div class="frame">
      <img class="base" id="girlImg" alt="">
      <video class="loop" data-loop="idle" muted playsinline loop preload="auto" disablepictureinpicture disableremoteplayback aria-hidden="true" tabindex="-1"></video>
      <video class="loop" data-loop="talk" muted playsinline loop preload="auto" disablepictureinpicture disableremoteplayback aria-hidden="true" tabindex="-1"></video>
      <img class="expr" alt="" aria-hidden="true">
    </div>
  </figure>
  <figure class="pet" id="petFig">
    <div class="frame">
      <img class="base" id="petImg" alt="">
      <video class="loop" data-loop="idle" muted playsinline loop preload="auto" disablepictureinpicture disableremoteplayback aria-hidden="true" tabindex="-1"></video>
      <img class="expr" alt="" aria-hidden="true">
    </div>
    <figcaption id="petSay" class="glass" hidden></figcaption>
  </figure>
  <div class="night" aria-hidden="true"></div>

  <header class="bar">
    <div class="when"><b id="date" class="glass"></b><span id="dlabel" class="tag"></span></div>
    <div id="next" class="next glass"></div>
    <div id="alarm" class="tag alarm glass" hidden></div>
    <button id="swap" class="ghost glass" type="button">换伙伴</button>
  </header>

  <section id="bubble" class="bubble glass" aria-live="polite">
    <b id="who"></b>
    <p id="say"></p>
    <small id="heard" hidden></small>
  </section>

  <aside class="side">
    <div class="panel glass">
      <h2>今天要做的事</h2>
      <ul id="tasks" class="tasks"></ul>
    </div>
    <div class="panel glass love">
      <div class="love-row"><b id="petName"></b><span id="stageName" class="tag"></span></div>
      <div class="meter"><i id="meterFill"></i></div>
      <span id="loveText" class="love-text"></span>
    </div>
  </aside>

  <div class="dock">
    <form id="typeForm" class="type glass" hidden>
      <input id="typeText" maxlength="100" placeholder="打字也可以" autocomplete="off">
      <button type="submit">发送</button>
    </form>
    <div class="talk">
      <button id="mic" class="mic" type="button">按一下说话</button>
      <button id="kbd" class="ghost glass round" type="button">打字</button>
    </div>
  </div>
</main>

<div id="picker" class="sheet" hidden>
  <div class="sheet-card wide" role="dialog" aria-label="换伙伴">
    <h2>选一个说话的伙伴</h2>
    <div id="pickGirls" class="pick"></div>
    <h2>选一个一起长大的宠物</h2>
    <div id="pickPets" class="pick"></div>
    <button id="pickClose" class="ghost" type="button">好啦</button>
  </div>
</div>

<div id="confirm" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-label="确认">
    <p id="confirmText"></p>
    <div class="row">
      <button id="confirmYes" type="button">做完啦</button>
      <button id="confirmNo" class="ghost" type="button">还没有</button>
    </div>
  </div>
</div>

</body>
</html>
