# MoMo: the line from the server to Ark in Beijing drops packets, and with the default
# CUBIC a few seconds of speech took 18-20 s to upload. BBR brings that to about 2 s.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# Keep-alive connections keep their speed between turns instead of starting slow again.
net.ipv4.tcp_slow_start_after_idle = 0
